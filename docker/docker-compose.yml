version: "3.9"

services:
  robosplat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: robosplat:latest
    container_name: robosplat

    # Mount data and output directories from the host
    volumes:
      - ../data:/workspace/data
      - ../output:/workspace/output

    # Enable NVIDIA GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Keep the container running for interactive use
    stdin_open: true
    tty: true

    # Override default command for interactive shell
    # To generate demos, run:
    #   docker compose run robosplat python data_aug/generate_demo.py \
    #     --image_size 256 --save True --save_video True \
    #     --ref_demo_path data/source_demo/real_000000.h5 \
    #     --xy_step_str '[10, 10]' --output_path data/generated_demo/pick_100
    command: ["bash"]
